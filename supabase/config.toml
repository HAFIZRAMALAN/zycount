# Local Supabase for CI (ci.yml). Two uses:
#   supabase db start  → database only: migrations, invariants, backup drill, load test
#   supabase start     → database + auth + API + edge functions, for the browser
#                        end-to-end tests in e2e/ (the app served from localhost:8767)
# The hosted project is qkrikvmkoelusyjjqdkd; this file does not configure it.
project_id = "zycount"

[db]
port = 54322
major_version = 17

[api]
enabled = true
port = 54321

[auth]
site_url = "http://localhost:8767/login.html"
additional_redirect_urls = ["http://localhost:8767/**", "http://127.0.0.1:8767/**"]

[studio]
enabled = false

[inbucket]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = true

[analytics]
enabled = false

# Same as the hosted project: these do their own auth checks.
[functions.signup]
verify_jwt = false

[functions.billing]
verify_jwt = false
