name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Secrets are placeholders for CI only; production loads real values from a
  # secret manager (docs/spec/15 — Environments).
  DATABASE_URL: postgresql://zycount:zycount@localhost:5432/zycount_test?schema=public
  JWT_ACCESS_SECRET: ci-access-secret-long-enough-for-tests
  JWT_REFRESH_SECRET: ci-refresh-secret-long-enough-for-tests
  NODE_ENV: test

jobs:
  # install -> typecheck -> lint -> unit, per docs/spec/15 (CI on every PR).
  static:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @zycount/db prisma:generate

      - name: Build the shared packages
        run: pnpm --filter @zycount/shared build && pnpm --filter @zycount/db build

      - run: pnpm typecheck
      - run: pnpm lint
      # Every package's unit suite, not just the shared one — the API's own
      # tests were invisible to CI while this named a single filter.
      - name: Unit tests
        run: pnpm test

  # The suite that decides whether the books can be trusted (docs/spec/12 §60).
  accounting-invariants:
    name: Integration and accounting invariants
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zycount
          POSTGRES_PASSWORD: zycount
          POSTGRES_DB: zycount_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zycount"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the shared packages
        run: pnpm --filter @zycount/shared build && pnpm --filter @zycount/db build

      - name: Apply migrations
        run: pnpm --filter @zycount/db prisma:deploy

      - name: Seed the demo companies
        run: pnpm --filter @zycount/db seed

      # Any broken invariant fails the build — an unbalanced ledger never ships.
      - name: Accounting invariant suite
        run: pnpm --filter @zycount/api test:int

  # The live product's backend: every migration applied in order to a fresh
  # Supabase database, then the invariant, tenant-isolation and privilege
  # suite (supabase/tests/invariants.sql). Inside one transaction, rolled back.
  supabase:
    name: Supabase migrations and invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # From npm, not GitHub releases: the platform binary ships as
      # @supabase/cli-linux-x64, so a GitHub release-download outage (HTTP 504
      # on PR #24) can't break the job. Pinned below the v3 major release.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the Supabase CLI
        run: |
          npm install -g supabase@2.122.1
          supabase --version

      - name: Start a local database and apply every migration
        run: |
          supabase db start
          supabase migration up --local

      - name: Invariant suite
        shell: bash
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -c 'begin' -f supabase/tests/invariants.sql -c 'rollback' 2>&1 | tee invariants.log
          grep -q "INVARIANTS PASSED" invariants.log

      # The same dump → restore → verify scripts the daily backup uses
      # (.github/workflows/backup.yml), proved here on every pull request.
      # The invariant suite runs once more and is kept, so there are real
      # books, documents and sign-ins to back up.
      - name: Backup and restore drill
        shell: bash
        env:
          ADMIN: postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 \
            -c 'begin' -f supabase/tests/invariants.sql -c 'commit'
          SRC_URL="$ADMIN" OUT_DIR="$RUNNER_TEMP/drill" bash supabase/backup/dump.sh
          ADMIN_URL="$ADMIN" DUMP_DIR="$RUNNER_TEMP/drill" STRICT_COUNTS=1 bash supabase/backup/restore-check.sh

      # Audit R8: 50 connections posting invoices (each sent twice, like a
      # retry) and cash sales into ONE company — first non-stop (correctness
      # under the worst contention), then at 20 calls a second (p95 < 500 ms).
      # Fails on any numbering gap or duplicate, double post, unbalanced entry
      # or failed call.
      - name: Load test — 50 people posting at once
        shell: bash
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" CLIENTS=50 SECONDS_=60 RATE=20 P95_MS=500 \
            bash supabase/tests/load/run.sh

  # Audit R7 + G4: the live app in a real browser (Chromium) against a full
  # local Supabase — auth, API and the edge functions from supabase/functions.
  e2e:
    name: Browser end-to-end and edge functions
    # Pinned: Playwright 1.55 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the Supabase CLI
        run: npm install -g supabase@2.122.1

      - name: Start Supabase (database, auth, API, edge functions)
        run: |
          supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,realtime,mailpit
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed 's/^API_URL=/SUPA_URL=/; s/^ANON_KEY=/SUPA_ANON=/' | tr -d '"' >> "$GITHUB_ENV"

      - name: Serve the app on localhost:8767
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/http.log" 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8767/login.html > /dev/null && break; sleep 1; done

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the tests
        working-directory: e2e
        env:
          E2E_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx playwright test

      - name: Keep the screens for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: e2e/screens
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zycount/db prisma:generate
      - run: pnpm build
