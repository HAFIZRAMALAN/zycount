# Publishes the demo workspace at https://hafizramalan.github.io/zycount/
#
# Pages serves this repository from the `gh-pages` branch, so the job copies
# `docs/` onto that branch rather than deploying through the Pages environment —
# an Actions deployment is refused while the source is a branch.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Copy docs to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy the site onto gh-pages
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp -R docs/. "$site/"
          touch "$site/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan gh-pages-next
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R "$site/." .

          git add -A
          git commit -m "site: ${GITHUB_SHA::7}"
          git push --force origin gh-pages-next:gh-pages
