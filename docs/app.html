<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* Sign-in gate: the workspace opens only with a session from login.html. */
(function () {
  var s = null;
  try { s = JSON.parse(localStorage.getItem("zycount.session") || sessionStorage.getItem("zycount.session") || "null"); } catch (e) {}
  if (!s || !s.email) { location.replace("login.html?next=" + encodeURIComponent(location.hash || "")); return; }
  window.ZY_USER = s;
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Zycount — accounting software for Malaysian SMEs. A live workspace on the seeded books of a demo trading company: dashboard, journals, general ledger, trial balance, profit and loss, balance sheet.">
<meta property="og:title" content="Zycount Workspace">
<meta property="og:description" content="Double-entry accounting for Malaysian SMEs — dashboard, journals, ledger and the three statements, on real posted data.">
<meta property="og:type" content="website">
<style>
  :root{color-scheme:light}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Zycount Workspace</title>
<script src="js/zy-theme.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#F5F7FA; --card:#FFFFFF; --sunk:#EDF0F5; --rail:#111621; --rail-2:#19202E;
  --rail-line:#28313F; --rail-ink:#AFBACB; --rail-ink-2:#6F7C90;
  --ink:#161C28; --ink-2:#4C586B; --ink-3:#77839A;
  --line:#E2E6EE; --line-2:#EDF0F5;
  --brand:#3A3FD0; --brand-soft:#ECEDFB;
  --good:#1E7A54; --good-soft:#E4F3EB; --warn:#9A5B06; --warn-soft:#FBF0E1; --bad:#B3213C;
  --c1:#2463eb; --c2:#d97706; --c3:#a347d1; --c4:#259d65; --c5:#0d98d9; --c6:#da2f51;
  --row-h:32px; --cell-y:6px; --cell-x:10px;
  --r:8px;
}
:root[data-density="relaxed"]{ --row-h:42px; --cell-y:11px; --cell-x:14px; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    color-scheme:dark;
    --paper:#0A0E17; --card:#111826; --sunk:#161E2E; --rail:#0C111B; --rail-2:#141B29;
    --rail-line:#222C3D; --rail-ink:#AEBACD; --rail-ink-2:#6C7A90;
    --ink:#E9EEF7; --ink-2:#AAB6C9; --ink-3:#7C89A0;
    --line:#212A3B; --line-2:#1A2231;
    --brand:#7B80EE; --brand-soft:#1A1E3C;
    --good:#49BC86; --good-soft:#10281E; --warn:#D79A3F; --warn-soft:#2A2012; --bad:#EB6A83;
    --c1:#2172f5; --c2:#a96e07; --c3:#a644d7; --c4:#27915f; --c5:#0b86be; --c6:#df2248;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0A0E17; --card:#111826; --sunk:#161E2E; --rail:#0C111B; --rail-2:#141B29;
  --rail-line:#222C3D; --rail-ink:#AEBACD; --rail-ink-2:#6C7A90;
  --ink:#E9EEF7; --ink-2:#AAB6C9; --ink-3:#7C89A0;
  --line:#212A3B; --line-2:#1A2231;
  --brand:#7B80EE; --brand-soft:#1A1E3C;
  --good:#49BC86; --good-soft:#10281E; --warn:#D79A3F; --warn-soft:#2A2012; --bad:#EB6A83;
  --c1:#2172f5; --c2:#a96e07; --c3:#a644d7; --c4:#27915f; --c5:#0b86be; --c6:#df2248;
}
:root[data-theme="dim"]{
  color-scheme:dark;
  --paper:#1C2230; --card:#262D3D; --sunk:#2C3445; --rail:#181E2B; --rail-2:#222A3A;
  --rail-line:#343D51; --rail-ink:#BDC5D3; --rail-ink-2:#8792A6;
  --ink:#E4E8F0; --ink-2:#B9C1CF; --ink-3:#939DB0;
  --line:#3A4357; --line-2:#313A4C;
  --brand:#6D72E6; --brand-soft:#33375A;
  --good:#5CC497; --good-soft:#233D33; --warn:#E0A957; --warn-soft:#3B3223; --bad:#F08496;
  --c1:#4A86F5; --c2:#C18523; --c3:#B66BDF; --c4:#3BA575; --c5:#2A9ACD; --c6:#E2506F;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3,h4{margin:0;letter-spacing:-0.012em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

/* ── shell ─────────────────────────────────── */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);border-right:1px solid var(--rail-line);display:flex;flex-direction:column;
      position:sticky;top:0;height:100vh;height:100dvh}
.rail-top{display:flex;align-items:center;gap:9px;padding:14px 14px 12px}
.mark{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;
      font-weight:700;font-size:13px;flex:none}
.rail-top b{color:#fff;font-size:14px;font-weight:600;letter-spacing:-0.01em}
.rail-top small{display:block;color:var(--rail-ink-2);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:4px 8px 10px;scrollbar-width:thin}
.navgrp{margin-bottom:12px}
.navgrp>span{display:block;padding:4px 8px 3px;font-size:10px;font-weight:600;letter-spacing:.11em;
             text-transform:uppercase;color:var(--rail-ink-2)}
.navitem{display:flex;align-items:center;gap:9px;width:100%;padding:5.5px 9px;border-radius:6px;
         font-size:13px;color:var(--rail-ink);text-align:left;position:relative;transition:background .12s,color .12s}
.navitem:hover{background:var(--rail-2);color:#fff}
.navitem[aria-current="page"]{background:var(--rail-2);color:#fff;font-weight:500}
.navitem[aria-current="page"]::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;
         border-radius:0 2px 2px 0;background:var(--brand)}
.navitem svg{width:15px;height:15px;flex:none;opacity:.82}
.navitem.locked{color:var(--rail-ink-2);cursor:default}
.navitem.locked:hover{background:none;color:var(--rail-ink-2)}
.phase{margin-left:auto;font-size:9.5px;font-weight:600;padding:1px 4px;border-radius:3px;
       background:var(--rail-2);color:var(--rail-ink-2);border:1px solid var(--rail-line)}
.rail-foot{border-top:1px solid var(--rail-line);padding:9px 14px;color:var(--rail-ink-2);font-size:10.5px}
.rail-foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);
        border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
        padding:9px 20px;flex-wrap:wrap}
.co{display:flex;align-items:center;gap:8px;padding:4px 9px 4px 5px;border:1px solid var(--line);
    border-radius:6px;background:var(--card);font-size:13px}
.co .avatar{width:21px;height:21px;border-radius:5px;background:var(--brand-soft);color:var(--brand);
     display:grid;place-items:center;font-size:10.5px;font-weight:700}
.search{flex:1;min-width:140px;max-width:340px;display:flex;align-items:center;gap:7px;
        border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--ink-3);font-size:12.5px;background:var(--sunk)}
.search kbd{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;border:1px solid var(--line);
     border-radius:3px;padding:0 3px;background:var(--card)}
.iconbtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent}
.iconbtn:hover{background:var(--sunk);border-color:var(--line)}
.me{width:27px;height:27px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;
    font-size:11px;font-weight:600}

.page{padding:18px 20px 44px;display:flex;flex-direction:column;gap:14px;min-width:0}
.crumbs{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.crumbs b{font-weight:500;color:var(--ink-2)}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;justify-content:space-between}
.phead h1{font-size:20px;font-weight:600}
.phead .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.meta{display:flex;gap:18px;flex-wrap:wrap}
.meta div{font-size:11px;color:var(--ink-3)}
.meta b{display:block;font-size:12.5px;font-weight:500;color:var(--ink);letter-spacing:-0.005em}

/* ── toolbar ───────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
         border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:7px 9px}
.tsep{width:1px;height:18px;background:var(--line)}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;
       padding:3.5px 8px;font-size:12.5px;background:var(--card);color:var(--ink-2)}
.field input,.field select{border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0;width:100%}
.field.in{min-width:170px;flex:1;max-width:280px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{padding:3.5px 9px;font-size:11.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:500}
.count{margin-left:auto;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.count b{color:var(--ink);font-weight:600}

/* ── surfaces ──────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.card>header h3{font-size:13px;font-weight:600}
.card>header p{font-size:11.5px;color:var(--ink-3)}
.card>header .right{margin-left:auto;font-size:11.5px;color:var(--ink-3)}

/* ── kpi ───────────────────────────────────── */
.kpi-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--line);gap:1px;
          border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.kpi-head>div{background:var(--card);padding:13px 15px 14px}
.kpi-sub{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--line);gap:1px;
         border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.kpi-sub>div{background:var(--card);padding:9px 13px 11px}
.klabel{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.kval{font-size:26px;font-weight:600;letter-spacing:-0.025em;margin-top:5px;line-height:1.1}
.kpi-sub .kval{font-size:15px;font-weight:600;margin-top:3px;letter-spacing:-0.015em}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;margin-top:6px;color:var(--ink-3)}
.delta b{font-weight:600}
.delta.up b{color:var(--good)} .delta.down b{color:var(--bad)}
.kpi-sub .delta{margin-top:2px;font-size:10.5px}

/* ── tables ────────────────────────────────── */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--card);text-align:left;font-size:10.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:7px var(--cell-x);
  border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
tbody td{padding:var(--cell-y) var(--cell-x);border-bottom:1px solid var(--line-2);height:var(--row-h);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.r{text-align:right}
.nil{color:var(--ink-3)}
.code{color:var(--ink-3);font-size:11.5px;margin-right:7px}
.trunc{max-width:1px;width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;padding:1px 6px;
      border-radius:4px;border:1px solid var(--line);color:var(--ink-2);background:var(--card);white-space:nowrap}
.chip.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.dr{background:var(--sunk)}

/* ── statements ────────────────────────────── */
.stmt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.letterhead{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
            gap:16px;flex-wrap:wrap;align-items:flex-start}
.letterhead h2{font-size:16px;font-weight:600;letter-spacing:-0.015em}
.letterhead .org{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.letterhead .when{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.letterhead .stamp{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:right}
.stmt table{font-size:13px}
.stmt td{padding:4.5px 22px}
.stmt th{padding:8px 22px}
.stmt tbody tr td{border-bottom:0;height:auto}
.stmt tr.grp td{padding-top:15px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
                color:var(--ink-3);font-weight:600}
.stmt tr.ind td:first-child{padding-left:34px;color:var(--ink-2)}
.stmt tr.sub td{border-top:1px solid var(--line);font-weight:500;padding-top:6px}
.stmt tr.sub td:first-child{padding-left:34px}
.stmt tr.tot td{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);
                font-weight:600;padding-top:7px;padding-bottom:7px;margin-top:4px}
.stmt tr.tot.soft td{border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.stmt tfoot td{border-top:1px solid var(--line);background:var(--sunk);font-size:11.5px;color:var(--ink-2)}
.proofrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 22px;background:var(--sunk);
          border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.proofrow .ok{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:500}
.proofrow .figs{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap}
.proofrow b{font-weight:600;color:var(--ink)}

/* ── charts ────────────────────────────────── */
.chartbox{padding:12px 14px 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);padding:0 2px 8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.l{height:2.5px;border-radius:2px;width:12px;vertical-align:3px}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.hbars{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:12px}
.hbar .t{display:flex;gap:7px;min-width:0}
.hbar .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .v{font-weight:500}
.track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}

/* ── health ────────────────────────────────── */
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line)}
.health>div{background:var(--card);padding:12px 14px}
.health .hh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500}
.health .hv{font-size:17px;font-weight:600;margin-top:5px;letter-spacing:-0.02em}
.health p{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.pill{width:7px;height:7px;border-radius:50%;flex:none}

/* ── drawer ────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,14,23,.42);z-index:40;display:grid;justify-items:end}
.drawer{background:var(--card);width:min(520px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--line);
        display:flex;flex-direction:column}
.drawer header{display:flex;align-items:flex-start;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);
       position:sticky;top:0;background:var(--card);z-index:2}
.drawer header h3{font-size:14px;font-weight:600}
.drawer header p{font-size:12px;color:var(--ink-3);margin-top:2px}
.drawer .body{padding:0}
.drawer .foot{margin-top:auto;border-top:1px solid var(--line);background:var(--sunk);padding:11px 18px;
      display:flex;gap:14px;flex-wrap:wrap;font-size:12px;align-items:center}

.hint{font-size:11.5px;color:var(--ink-3)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;
        border-right:0;border-bottom:1px solid var(--rail-line)}
  .rail-top{padding:10px 14px}
  .nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;flex:1}
  .navgrp{margin:0;display:flex;gap:4px}
  .navgrp>span{display:none}
  .navitem{white-space:nowrap}
  .navitem.locked{display:none}
  .rail-foot{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .kpi-head{grid-template-columns:minmax(0,1fr)}
  .kpi-sub{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{padding:14px 16px 40px}
  .topbar{padding:9px 16px}
  .search{display:none}
  .co{min-width:0;flex:1}
  .co span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kpi-sub>div:last-child{grid-column:1/-1}
}

/* ── portal modules ────────────────────────────── */
.previewbar{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--warn);
  background:var(--warn-soft);border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--ink-2);line-height:1.45}
.previewbar svg{flex:none;margin-top:1px;color:var(--warn)}
.previewbar b{color:var(--ink)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.postingbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.postinghead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-2);background:var(--sunk)}
.postingbox table{font-size:12.5px}
.postingbox td{padding:5px 12px}
.postingbox .proofrow{padding:8px 12px;font-size:11.5px}
.capgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.confbar{display:grid;gap:4px}
table.mini{font-size:12.5px}
table.mini td{padding:4px 0;border-bottom:1px solid var(--line-2)}
.postingbox table.mini td{padding:4px 12px}
.suggestbox{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:6px;padding:8px 10px;font-size:12.5px}
.suggestbox p{margin-top:3px}
.metricgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.thread{padding:14px;display:grid;gap:12px}
.msg{display:grid;gap:4px}
.msg .who{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.msg .bubble{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;background:var(--card)}
.msg.user .bubble{background:var(--sunk);border-color:transparent}
.msg.assistant .bubble{border-left:3px solid var(--brand)}
.asked{border-top:1px solid var(--line-2);padding-top:11px;display:grid;gap:7px}
.asked .chips{display:flex;gap:6px;flex-wrap:wrap}
.asked .chip{cursor:pointer;font-size:11.5px;padding:3px 8px}
.asked .chip:hover{background:var(--sunk)}
ul.bounds{margin:0;padding:11px 14px 14px 30px;display:grid;gap:6px;font-size:12.5px;color:var(--ink-2)}
.totals{border-top:1px solid var(--line);background:var(--sunk);padding:10px 18px;display:grid;gap:4px;font-size:12.5px}

ol.timeline li{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;padding-left:12px;border-left:2px solid var(--line);
  padding-bottom:2px}
ol.timeline .when{color:var(--ink-3);font-size:11.5px}

  .capgrid,.metricgrid{grid-template-columns:minmax(0,1fr)}
}
.me-wrap{position:relative}

.me-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:250px;background:var(--card);border:1px solid var(--line);

.me-id b{font-weight:600}

.me-id .me-role{margin-top:6px;align-self:flex-start;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:500}
.me-co{padding:8px 10px;color:var(--ink-2);font-size:12px;border-bottom:1px solid var(--line-2)}
.me-menu a,.me-menu button[role="menuitem"]{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.me-menu a:hover,.me-menu button[role="menuitem"]:hover,.me-menu a:focus-visible,.me-menu button[role="menuitem"]:focus-visible{background:var(--sunk)}

function trendChart(rows) {
  const W = 840, H = 330, L = 52, R = 14, T = 14, B = 32;
  const iw = W - L - R, ih = H - T - B;
  const max = 225000, step = 45000;
  const y = (v) => T + ih - (v / max) * ih;
  const band = iw / rows.length, bw = Math.min(20, band / 3.2);
  let grid = "", bars = "", labels = "", pts = [];
  for (let v = 0; v <= max; v += step) {
    grid += `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"${v ? ' stroke-dasharray="2 4"' : ""}/>`;
    grid += `<text x="${L - 9}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" fill="var(--ink-3)" font-size="10" font-family="IBM Plex Mono, monospace">${compact(v)}</text>`;
  }
  rows.forEach((r, i) => {
    const cx = L + band * (i + 0.5);
    const rh = Math.max(2, y(0) - y(r.revenue)), eh = Math.max(2, y(0) - y(r.expenses));
    bars += `<rect x="${(cx - bw - 1.5).toFixed(1)}" y="${y(r.revenue).toFixed(1)}" width="${bw}" height="${rh.toFixed(1)}" rx="3" fill="var(--c1)"/>`;
    bars += `<rect x="${(cx + 1.5).toFixed(1)}" y="${y(r.expenses).toFixed(1)}" width="${bw}" height="${eh.toFixed(1)}" rx="3" fill="var(--c2)"/>`;
    labels += `<text x="${cx.toFixed(1)}" y="${H - 9}" text-anchor="middle" fill="var(--ink-3)" font-size="11">${MONTHS[r.m.slice(5)]}</text>`;
    pts.push([cx, y(r.profit)]);
  });
  const line = pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const dots = pts.map((p) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--card)" stroke="var(--c4)" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;display:block" role="img"
    aria-label="Revenue, expenses and net profit by month, January to August 2026. Revenue peaks at RM208,722 in June; net profit peaks at RM33,203 in June.">
    ${grid}${bars}
    <polyline fill="none" stroke="var(--c4)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>
    ${dots}${labels}</svg>`;
}

function cashChart(rows) {
  const W = 420, H = 190, L = 46, R = 12, T = 12, B = 26;
  const iw = W - L - R, ih = H - T - B, max = 300000, step = 75000;
  const y = (v) => T + ih - (v / max) * ih;
  const x = (i) => L + (iw / (rows.length - 1)) * i;
  let grid = "";
  for (let v = 0; v <= max; v += step) {
    grid += `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"${v ? ' stroke-dasharray="2 4"' : ""}/>`;
    grid += `<text x="${L - 8}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" fill="var(--ink-3)" font-size="9.5" font-family="IBM Plex Mono, monospace">${compact(v)}</text>`;
  }
  const pts = rows.map((r, i) => [x(i), y(r.cash)]);
  const line = pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area = `${L},${y(0).toFixed(1)} ${line} ${(W - R)},${y(0).toFixed(1)}`;
  const last = pts[pts.length - 1];
  const ticks = rows.map((r, i) => `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" fill="var(--ink-3)" font-size="10">${MONTHS[r.m.slice(5)]}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:320px;display:block" role="img"

    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.4" fill="var(--c5)" stroke="var(--card)" stroke-width="2"/>
    ${ticks}</svg>`;
}

function mixBars(rows) {
  const top = rows.slice(0, 7), total = rows.reduce((s, r) => s + r.a, 0);

/* ── journal drawer ──────────────────────────────────────────────── */
function openEntry(i) {
  const e = DATA.entries[i];
  if (!e) return;
  const dr = e.l.reduce((s, l) => s + l.dr, 0), cr = e.l.reduce((s, l) => s + l.cr, 0);
  const root = document.getElementById("drawer-root");
  root.innerHTML = `
    <div class="scrim" id="scrim">
      <aside class="drawer" role="dialog" aria-modal="true" aria-label="Journal ${e.r}">
        <header>
          <div><h3 class="mono">${e.r}</h3><p>${shortDate(e.d)} · ${esc(e.desc)}</p></div>
          <span class="chip ok" style="margin-left:auto">${TICK}Posted</span>
          <button class="iconbtn" id="closedrawer" aria-label="Close">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </header>
        <div class="body">
          <table>
            <thead><tr><th>Account</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead>
            <tbody>${e.l.map((l) => `<tr>
              <td><span class="code mono">${l.c}</span>${esc(l.n)}</td>
              <td class="r num mono${l.dr ? "" : " nil"}">${l.dr ? money(l.dr) : "—"}</td>
              <td class="r num mono${l.cr ? "" : " nil"}">${l.cr ? money(l.cr) : "—"}</td></tr>`).join("")}</tbody>
          </table>
          <div class="proofrow" style="border-top:1px solid var(--line)">
            <span class="ok">${TICK}This entry balances</span>
            <span class="figs"><span>Debit <b class="num mono">${money(dr)}</b></span>
            <span>Credit <b class="num mono">${money(cr)}</b></span></span>
          </div>
        </div>
        <div class="foot">
          <span class="hint">Source <b style="color:var(--ink)">${e.src}</b></span>
          <span class="hint">Posted by <b style="color:var(--ink)">Lim Wei Jian</b></span>
          <span class="hint" style="margin-left:auto">Posted entries are never edited — a correction is a reversal.</span>
        </div>
      </aside>
    </div>`;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.getElementById("closedrawer").addEventListener("click", close);
  document.getElementById("scrim").addEventListener("click", (ev) => { if (ev.target.id === "scrim") close(); });
  document.addEventListener("keydown", onKey);
  document.getElementById("closedrawer").focus();
}

const M = (v) => money(Number(v));
const Mn = (v) => Number(v);
const STATUS_TONE = { PAID:"ok", POSTED:"ok", APPROVED:"ok", ACTIVE:"ok", MATCHED:"ok", SUBMITTED:"ok", RECEIVED:"ok",
  OVERDUE:"bad", ON_HOLD:"bad", UNMATCHED:"bad", REVIEW:"warn", PENDING:"warn", PARTIALLY_PAID:"warn",
  SUGGESTED:"warn", DRAFT:"", SENT:"", EXPIRED:"", CANCELLED:"", ORDERED:"", DUE:"warn" };
const tone = (s) => STATUS_TONE[s] ?? "";
const nice = (s) => String(s).replace(/_/g, " ").toLowerCase().replace(/^./, (c) => c.toUpperCase());
const badge = (s) => `<span class="chip ${tone(s)}">${tone(s) === "ok" ? TICK : ""}${nice(s)}</span>`;
const dt = (iso) => (iso ? shortDate(String(iso).slice(0, 10)) : "—");

const preview = (phase, what) => `
  <div class="previewbar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
    <span><b>Preview.</b> ${what} arrives in phase ${phase}. The screen is built and the figures foot,
    but they come from a fixture — not from posted entries. Every document shows the journal it will produce.</span>
  </div>`;

/** Declarative table. cols: [{h, f(row), r?, cls?, w?}] */
function grid(cols, rows, opts = {}) {
  return `<section class="card"><div class="tablewrap"><table>
    <thead><tr>${cols.map((c) => `<th${c.r ? ' class="r"' : ""}${c.w ? ` style="width:${c.w}"` : ""}>${c.h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((row, i) => `<tr${opts.click ? ` class="click" data-doc="${opts.click}:${i}"` : ""}>${
      cols.map((c) => `<td${c.r ? ' class="r"' : ""}${c.cls ? ` class="${c.cls}"` : ""}>${c.f(row, i)}</td>`).join("")
    }</tr>`).join("")}</tbody>
    ${opts.foot ? `<tfoot><tr>${opts.foot.map((f) => `<td${f.r ? ' class="r"' : ""}${f.b ? ' style="font-weight:600"' : ""}${f.span ? ` colspan="${f.span}"` : ""}>${f.v}</td>`).join("")}</tr></tfoot>` : ""}
  </table></div>${opts.proof ? opts.proof : ""}</section>`;
}

function sparkline(values, color) {
  const W = 104, H = 26, min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => [ (W / (values.length - 1)) * i, H - 3 - ((v - min) / span) * (H - 6) ]);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden style="display:block">
    <polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"
      points="${pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")}"/>
    <circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}

      </section>
      <section class="card">
        <header><div><h3>Expense mix</h3><p>${PORTAL.DEMO_PERIOD.label}</p></div></header>
        <div class="hbars">${mix.map((m, i) => `
          <div class="hbar"><div class="t"><span class="mono code">${m.accountCode}</span><span>${esc(m.name)}</span></div>
            <div class="v num mono">${M(m.value)}</div>
            <div class="track"><i style="width:${((m.value / mixMax) * 100).toFixed(1)}%;background:${hues[i % 6]}"></i></div></div>`).join("")}</div>
      </section>
    </div>

    <div class="grid2">
      <section class="card">
        <header><div><h3>Best-selling items</h3><p>Units, revenue and the margin each carries</p></div></header>
        <div class="tablewrap"><table>
          <thead><tr><th>SKU</th><th>Item</th><th class="r">Units</th><th class="r">Revenue</th><th class="r">Margin</th></tr></thead>
          <tbody>${PORTAL.TOP_ITEMS.map((t) => `<tr>
            <td class="mono" style="font-size:12px">${t.sku}</td><td class="trunc">${esc(t.name)}</td>
            <td class="r num mono">${t.units}</td><td class="r num mono">${M(t.revenue)}</td>
            <td class="r num">${(t.margin * 100).toFixed(1)}%</td></tr>`).join("")}</tbody></table></div>
      </section>
      <section class="card">
        <header><div><h3>Margin</h3><p>Gross against operating, six months</p></div></header>
        <div class="hbars">${PORTAL.MARGIN_TREND.map((m) => `
          <div class="hbar"><div class="t"><span>${esc(m.label)}</span></div>
            <div class="v num">${(m.grossMargin * 100).toFixed(1)}% <span class="hint">gross</span> · ${(m.operatingMargin * 100).toFixed(1)}% <span class="hint">operating</span></div>
            <div class="track"><i style="width:${(m.grossMargin * 100).toFixed(1)}%;background:var(--c1)"></i></div>
            <div class="track" style="margin-top:-4px"><i style="width:${(m.operatingMargin * 100).toFixed(1)}%;background:var(--c4)"></i></div></div>`).join("")}</div>
      </section>
    </div>`;
};

/* ── copilot ─────────────────────────────────────────────────────── */
PAGES["ai-copilot"] = () => crumbs("Zycount", "Copilot") +
  head("Copilot", "Asks the ledger, cites what it read, changes nothing on its own",
       [["Reads", "Posted entries only"], ["Writes", "Never without approval"]]) +
  preview(6, "The copilot") + `
  <div class="grid2">
    <section class="card">
      <header><div><h3>Conversation</h3><p>Every figure links to the entry behind it</p></div></header>
      <div class="thread">${PORTAL.COPILOT_THREAD.map((m) => `
        <div class="msg ${m.role}">
          <span class="who">${m.role === "user" ? "Aisyah" : "Copilot"}</span>
          <div class="bubble">${esc(m.content).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>")}</div>
        </div>`).join("")}
        <div class="asked"><span class="hint">Ask it something</span>
          <div class="chips">${PORTAL.COPILOT_SUGGESTIONS.map((s) => `<button class="chip">${esc(s)}</button>`).join("")}</div>
        </div>
      </div>
    </section>
    <div style="display:grid;gap:14px;min-width:0">
      <section class="card">
        <header><div><h3>What it is reading</h3><p>The context behind the answer</p></div></header>
        <div class="tablewrap"><table><tbody>${PORTAL.COPILOT_CONTEXT.map((c) => `<tr>
          <td class="nil">${esc(c.label)}</td><td class="r"><span class="num mono" style="color:var(--brand)">${
            /^-?[\d.]+$/.test(c.value) ? money(Number(c.value), { symbol: true }) : esc(c.value)}</span></td>
        </tr>`).join("")}</tbody></table></div>
      </section>
      <section class="card">
        <header><div><h3>What it will not do</h3><p>The boundaries, stated on the screen</p></div></header>
        <ul class="bounds">${PORTAL.COPILOT_BOUNDARIES.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>
      </section>
    </div>
  </div>`;

/* ── document drawer (invoices and bills) ────────────────────────── */
function openDoc(key, index) {
  const d = PORTAL[key][index];
  if (!d) return;
  const root = document.getElementById("drawer-root");
  root.innerHTML = `
    <div class="scrim" id="scrim">
      <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(d.number)}">
        <header>
          <div><h3 class="mono">${esc(d.number)}</h3><p>${esc(d.partyName)} · issued ${dt(d.issuedOn)}, due ${dt(d.dueOn)}</p></div>
          <span style="margin-left:auto">${badge(d.status)}</span>
          <button class="iconbtn" id="closedrawer" aria-label="Close">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </header>
        <div class="body">
          <table>
            <thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Unit</th><th>Tax</th><th class="r">Total</th></tr></thead>
            <tbody>${d.lines.map((l) => `<tr>
              <td>${l.itemCode ? `<span class="code mono">${l.itemCode}</span>` : ""}${esc(l.description)}
                ${l.discountPercent ? `<span class="hint"> · ${l.discountPercent}% off</span>` : ""}</td>
              <td class="r num mono">${l.quantity} <span class="hint">${esc(l.unit)}</span></td>
              <td class="r num mono nil">${M(l.unitPrice)}</td>
              <td><span class="chip">${esc(l.taxCode)}</span></td>
              <td class="r num mono">${M(l.total)}</td></tr>`).join("")}</tbody>
          </table>
          <div class="totals">
            <div><span>Subtotal</span><b class="num mono">${M(d.subtotal)}</b></div>
            ${Mn(d.discount) ? `<div><span>Discount</span><b class="num mono">(${M(d.discount)})</b></div>` : ""}
            <div><span>SST</span><b class="num mono">${M(d.tax)}</b></div>
            <div class="big"><span>Total</span><b class="num mono">${M(d.total)}</b></div>
            <div><span>Paid</span><b class="num mono">${M(d.paid)}</b></div>
            <div class="big"><span>Balance</span><b class="num mono">${M(d.balance)}</b></div>
          </div>
          <div style="padding:0 18px 14px">
            <h4 class="sechead">The entry this posts</h4>
            ${postingTable(d.posting)}
          </div>
          ${d.allocations.length ? `<div style="padding:0 18px 14px">
            <h4 class="sechead">Applied against it</h4>
            <table class="mini"><tbody>${d.allocations.map((a) => `<tr>
              <td class="nil">${dt(a.date)}</td><td>${nice(a.method)}</td>
              <td class="mono" style="font-size:12px">${esc(a.reference)}</td>
              <td class="r num mono">${M(a.amount)}</td></tr>`).join("")}</tbody></table></div>` : ""}
          <div style="padding:0 18px 18px">
            <h4 class="sechead">History</h4>
            <ol class="timeline">${d.activity.map((a) => `<li>
              <span class="when">${dt(a.at)}</span>
              <span><b>${esc(a.event)}</b> — ${esc(a.actor)}${a.detail ? `<span class="hint"> · ${esc(a.detail)}</span>` : ""}</span></li>`).join("")}</ol>
          </div>
        </div>
        <div class="foot"><span class="hint">Preview data</span>
          <span class="hint" style="margin-left:auto">Nothing here has reached the ledger — the entry above is what it will post.</span></div>
      </aside>
    </div>`;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.getElementById("closedrawer").addEventListener("click", close);
  document.getElementById("scrim").addEventListener("click", (ev) => { if (ev.target.id === "scrim") close(); });
  document.addEventListener("keydown", onKey);
  document.getElementById("closedrawer").focus();
}

/* ── state, nav, routing ─────────────────────────────────────────── */
const store = {
  get(k, fallback) { try { return localStorage.getItem(k) ?? fallback; } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } },
};
const VALID = new Set(Object.keys(PAGES));
const hashRoute = () => { const h = location.hash.replace("#", ""); return VALID.has(h) ? h : null; };
const state = {
  route: hashRoute() || store.get("zy.route", "dashboard"),
  density: store.get("zy.density", "compact"),
};
if (!VALID.has(state.route)) state.route = "dashboard";
document.documentElement.setAttribute("data-density", state.density);

if (window.ZYTheme) ZYTheme.mount(document.getElementById("theme"));

function renderNav() {
  document.getElementById("nav").innerHTML = NAV.map((g) => `
    <div class="navgrp"><span>${g.label}</span>
      ${g.items.map(([id, label, icon, phase]) => phase
        ? `<div class="navitem locked" title="Wired to the API in phase ${phase}">${ICONS[icon]}<span>${label}</span><span class="phase">P${phase}</span></div>`
        : `<button class="navitem" data-route="${id}"${state.route === id ? ' aria-current="page"' : ""}>${ICONS[icon]}<span>${label}</span></button>`
      ).join("")}
    </div>`).join("");
  document.querySelectorAll("[data-route]").forEach((b) =>
    b.addEventListener("click", () => go(b.dataset.route)));
}

function wire() {
  document.querySelectorAll("[data-density]").forEach((b) => b.addEventListener("click", () => {
    state.density = b.dataset.density;
    document.documentElement.setAttribute("data-density", state.density);
    store.set("zy.density", state.density);
    document.querySelectorAll("[data-density]").forEach((o) =>
      o.setAttribute("aria-pressed", String(o.dataset.density === state.density)));
  }));

  document.querySelectorAll("[data-entry]").forEach((r) =>
    r.addEventListener("click", () => openEntry(Number(r.dataset.entry))));

  document.querySelectorAll("[data-doc]").forEach((r) => r.addEventListener("click", () => {
    const [key, index] = r.dataset.doc.split(":");
    openDoc(key, Number(index));
  }));

  const filter = (bodyId, countId, read, noun) => {
    const body = document.getElementById(bodyId);
    if (!body) return;
    const apply = () => {
      const q = read();
      let shown = 0;
      body.querySelectorAll("tr").forEach((tr) => {
        const ok = q.every((test) => test(tr));
        tr.hidden = !ok;
        if (ok) shown++;
      });
      const count = document.getElementById(countId);
      if (count) count.innerHTML = `<b>${shown}</b> of ${body.querySelectorAll("tr").length} ${noun}`;
    };
    apply();
    return apply;
  };

  const search = document.getElementById("jsearch"), source = document.getElementById("jsource");
  if (search) {
    const apply = filter("jbody", "jcount", () => [
      (tr) => tr.dataset.text.includes(search.value.trim().toLowerCase()),
      (tr) => !source.value || tr.dataset.src === source.value,
    ], "entries");
    search.addEventListener("input", apply);
    source.addEventListener("change", apply);
  }

  const asearch = document.getElementById("asearch");
  if (asearch) {
    const type = document.getElementById("atype"), moved = document.getElementById("amoved");
    const apply = filter("abody", "acount", () => [
      (tr) => tr.dataset.text.includes(asearch.value.trim().toLowerCase()),
      (tr) => !type.value || tr.dataset.type === type.value,
      (tr) => !moved.value || tr.dataset.moved === "1",
    ], "accounts");
    [asearch, type, moved].forEach((el) => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", apply));
  }

  const tsearch = document.getElementById("tsearch");
  if (tsearch) {
    const apply = filter("tbody", "tcount", () => [
      (tr) => tr.dataset.text.includes(tsearch.value.trim().toLowerCase()),
    ], "accounts");
    tsearch.addEventListener("input", apply);
  }
}

function go(route) {
  if (!VALID.has(route)) route = "dashboard";
  state.route = route;
  store.set("zy.route", route);
  if (location.hash !== "#" + route) history.replaceState(null, "", "#" + route);
  document.getElementById("page").innerHTML = PAGES[route]();
  document.querySelectorAll("[data-route]").forEach((b) => {
    if (b.dataset.route === route) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  window.scrollTo({ top: 0 });
  wire();
}

window.addEventListener("hashchange", () => { const r = hashRoute(); if (r && r !== state.route) go(r); });

/* ── signed-in user menu ───────────────────────────────────────── */
(function userMenu() {
  const u = window.ZY_USER || {};
  const name = u.name || "User";
  const ini = name.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join("");
  const btn = document.getElementById("me-btn");
  const menu = document.getElementById("me-menu");
  btn.textContent = ini || "U";
  btn.title = name;
  document.getElementById("me-name").textContent = name;
  document.getElementById("me-email").textContent = u.email || "";
  document.getElementById("me-role").textContent = u.role || "";
  document.getElementById("me-co").textContent = u.company && u.company !== "Zycount Demo Trading Sdn Bhd"
    ? `${u.company} — viewing the demo company's books`
    : "Zycount Demo Trading Sdn Bhd";
  const open = (v) => { menu.hidden = !v; btn.setAttribute("aria-expanded", String(v)); };
  btn.addEventListener("click", (e) => { e.stopPropagation(); open(menu.hidden); });
  document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) open(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") open(false); });
  document.getElementById("me-signout").addEventListener("click", () => {
    localStorage.removeItem("zycount.session");
    sessionStorage.removeItem("zycount.session");
    location.replace("login.html?signedout=1");
  });
})();

// A real account opens its own books; the demo accounts open the sample company.
if (window.ZY_USER && ZY_USER.mode === "live" && window.ZL) ZL.boot();
else { if (window.ZL) ZL.theme(); renderNav(); go(state.route); }
</script>
